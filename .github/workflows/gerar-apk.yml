name: Gerar APK do MLOG Scanner Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  compilar-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ubuntu-24.04 ja possui SDK Android 35 e Build Tools 35.
      # Nao usamos setup-android nem sdkmanager --licenses, pois foi esta
      # configuracao que bloqueou a primeira tentativa.
      - name: Verificar Android SDK preinstalado
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || {
            echo 'ERRO: Android SDK Platform 35 indisponivel no runner.'
            ls -la "$ANDROID_HOME/platforms" || true
            exit 1
          }
          test -d "$ANDROID_HOME/build-tools/35.0.0" || {
            echo 'ERRO: Android Build Tools 35.0.0 indisponivel no runner.'
            ls -la "$ANDROID_HOME/build-tools" || true
            exit 1
          }

      - name: Preparar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK de testes
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Validar APK gerado
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MLOG-Scanner-Bridge-v11-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
