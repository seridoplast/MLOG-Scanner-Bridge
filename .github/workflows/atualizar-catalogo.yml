name: Atualizar catalogo publico de Releases

on:
  release:
    types: [published, edited, released, prereleased, deleted, unpublished]
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write

concurrency:
  group: bridge-release-catalog
  cancel-in-progress: false

jobs:
  publicar-catalogo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Publicar catalogo em branch propria e espelho legado
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release_feed.py
